<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>Dog Adoption Application</title>
</head>

<body>
	<form>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Name">

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" placeholder="Phone Number">

    <label for="address">Address</label>
    <input type="text" id="address" placeholder="Address">

    <input type="checkbox" id="checkbox" name="dogExperience" value="yes">
    <label for="checkbox">Have you ever lived with a Dog before?</label>
	<br><br>

    <label for="multiSelect">Please select your preferred breeds</label>
    <select id="multiSelect" multiple>
        <option value="labrador">Labrador</option>
        <option value="golden-retriever">Golden Retriever</option>
        <option value="german-shepherd">German Shepherd</option>
		<option value="beagle">Beagle</option>
    </select>

    <input type="submit" value="Submit">
</form>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
